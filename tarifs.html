<!DOCTYPE html>
<html class="dark" lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>MonColibri - Tarifs</title>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#36e27b",
                        "background-light": "#f6f8f7",
                        "background-dark": "#112117",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased">
    <div id="header-placeholder"></div>
    <main class="container mx-auto px-6 py-12">
        <h1 class="text-4xl font-bold text-center text-primary mb-8">Tarifs</h1>
        <div class="text-center text-lg">
            <p>MonColibri est une application à très faible coût pour rendre le soutien psychologique accessible à tous.</p>
            <p>Nous proposons différents plans pour répondre à vos besoins. Contactez-nous pour en savoir plus.</p>
        </div>
    </main>
    <div id="footer-placeholder"></div>
    <script src="js/main.js"></script>
</body>
</html>
